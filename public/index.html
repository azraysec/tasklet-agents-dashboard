<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasklet Agents Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
      padding: 24px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #f1f5f9;
    }
    .header h1::before {
      content: '🤖';
      font-size: 32px;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: #22c55e;
    }
    .live-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    .stat-card .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 36px;
      font-weight: 700;
      color: #06b6d4;
    }
    .stat-card.active .value { color: #22c55e; }
    .stat-card.inactive .value { color: #94a3b8; }
    
    .agents-section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #f1f5f9;
    }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .agent-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s ease;
    }
    .agent-card:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.2);
      transform: translateY(-2px);
    }
    .agent-card.active {
      border-left: 3px solid #22c55e;
    }
    .agent-card.inactive {
      border-left: 3px solid #64748b;
    }
    .agent-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .agent-name {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .status-badge.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }
    .status-badge.inactive {
      background: rgba(100, 116, 139, 0.15);
      color: #94a3b8;
    }
    .agent-meta {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    .agent-meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .updated-at {
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #ef4444;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: #94a3b8;
    }
    .loading::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 2px solid #94a3b8;
      border-top-color: transparent;
      border-radius: 50%;
      margin-left: 12px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tasklet Agents Dashboard</h1>
    <div class="live-badge">Synced every 10 min</div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Agents</div>
      <div class="value" id="total-count">-</div>
    </div>
    <div class="stat-card active">
      <div class="label">Active</div>
      <div class="value" id="active-count">-</div>
    </div>
    <div class="stat-card inactive">
      <div class="label">Inactive</div>
      <div class="value" id="inactive-count">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Last Sync</div>
      <div class="value" id="last-sync" style="font-size: 16px;">-</div>
    </div>
  </div>

  <div class="agents-section">
    <h2>All Agents</h2>
    <div id="agents-container" class="loading">Loading agents...</div>
  </div>

  <script>
    async function loadAgents() {
      const container = document.getElementById('agents-container');
      try {
        const res = await fetch('/api/agents');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const agents = await res.json();
        
        const active = agents.filter(a => a.status === 'active').length;
        const inactive = agents.length - active;
        
        document.getElementById('total-count').textContent = agents.length;
        document.getElementById('active-count').textContent = active;
        document.getElementById('inactive-count').textContent = inactive;
        
        if (agents.length > 0 && agents[0].updated_at) {
          const syncDate = new Date(agents[0].updated_at + 'Z');
          document.getElementById('last-sync').textContent = syncDate.toLocaleString();
        }
        
        if (agents.length === 0) {
          container.innerHTML = '<div class="error-message">No agents found</div>';
          container.className = '';
          return;
        }
        
        container.className = 'agents-grid';
        container.innerHTML = agents.map(agent => `
          <div class="agent-card ${agent.status}">
            <div class="agent-header">
              <div class="agent-name">${escapeHtml(agent.name)}</div>
              <span class="status-badge ${agent.status}">${agent.status}</span>
            </div>
            <div class="agent-meta">
              <span>⚡ ${agent.triggers_count || 0} triggers</span>
              <span>📋 ${agent.tasks_count || 0} tasks</span>
              <span>🔗 ${agent.connections_count || 0} connections</span>
            </div>
            <div class="updated-at">Updated: ${formatDate(agent.updated_at)}</div>
          </div>
        `).join('');
      } catch (err) {
        container.className = '';
        container.innerHTML = `<div class="error-message">Error loading agents: ${escapeHtml(err.message)}</div>`;
      }
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return 'Never';
      const d = new Date(dateStr + 'Z');
      return d.toLocaleString();
    }
    
    loadAgents();
    setInterval(loadAgents, 60000);
  </script>
</body>
</html>

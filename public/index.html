<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasklet Agents Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 600;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .refresh-info {
      font-size: 0.875rem;
      color: #888;
    }
    
    .stats-bar {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .stat-card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 0.5rem;
    }
    
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #00d9ff;
    }
    
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.5rem;
    }
    
    .agent-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .agent-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    
    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    
    .agent-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    
    .agent-name a {
      color: inherit;
      text-decoration: none;
    }
    
    .agent-name a:hover {
      color: #00d9ff;
    }
    
    .agent-description {
      font-size: 0.875rem;
      color: #888;
      line-height: 1.4;
    }
    
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-active {
      background: rgba(0, 255, 136, 0.2);
      color: #00ff88;
    }
    
    .status-paused {
      background: rgba(255, 193, 7, 0.2);
      color: #ffc107;
    }
    
    .status-error {
      background: rgba(255, 82, 82, 0.2);
      color: #ff5252;
    }
    
    .agent-stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .agent-stat {
      display: flex;
      flex-direction: column;
    }
    
    .agent-stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }
    
    .agent-stat-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #00d9ff;
    }
    
    .last-activity {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #666;
    }
    
    .loading {
      text-align: center;
      padding: 4rem;
      color: #888;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem;
      color: #666;
    }
    
    .empty-state h2 {
      margin-bottom: 0.5rem;
      color: #888;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Tasklet Agents Dashboard</h1>
      <div class="refresh-info">
        <span class="live-indicator">
          <span class="live-dot"></span>
          <span>Live</span>
        </span>
        <span id="lastUpdate"></span>
      </div>
    </header>
    
    <div class="stats-bar">
      <div class="stat-card">
        <h3>Total Agents</h3>
        <div class="value" id="totalAgents">-</div>
      </div>
      <div class="stat-card">
        <h3>Active</h3>
        <div class="value" id="activeAgents">-</div>
      </div>
      <div class="stat-card">
        <h3>Total Triggers</h3>
        <div class="value" id="totalTriggers">-</div>
      </div>
      <div class="stat-card">
        <h3>Open Tasks</h3>
        <div class="value" id="totalTasks">-</div>
      </div>
    </div>
    
    <div id="agentsGrid" class="agents-grid">
      <div class="loading">Loading agents...</div>
    </div>
  </div>
  
  <script>
    function timeAgo(dateString) {
      if (!dateString) return 'Never';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      
      if (seconds < 60) return 'Just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }
    
    function getStatusClass(status) {
      switch (status?.toLowerCase()) {
        case 'active': return 'status-active';
        case 'paused': return 'status-paused';
        case 'error': return 'status-error';
        default: return 'status-active';
      }
    }
    
    async function loadAgents() {
      try {
        const response = await fetch('/api/agents');
        const agents = await response.json();
        
        // Update stats
        document.getElementById('totalAgents').textContent = agents.length;
        document.getElementById('activeAgents').textContent = agents.filter(a => a.status === 'active').length;
        document.getElementById('totalTriggers').textContent = agents.reduce((sum, a) => sum + (a.triggers_count || 0), 0);
        document.getElementById('totalTasks').textContent = agents.reduce((sum, a) => sum + (a.tasks_count || 0), 0);
        
        const grid = document.getElementById('agentsGrid');
        
        if (agents.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <h2>No agents found</h2>
              <p>Waiting for data sync...</p>
            </div>
          `;
          return;
        }
        
        grid.innerHTML = agents.map(agent => `
          <div class="agent-card">
            <div class="agent-header">
              <div>
                <div class="agent-name">
                  ${agent.url ? `<a href="${agent.url}" target="_blank">${agent.name}</a>` : agent.name}
                </div>
                <div class="agent-description">${agent.description || 'No description'}</div>
              </div>
              <span class="status-badge ${getStatusClass(agent.status)}">${agent.status || 'active'}</span>
            </div>
            <div class="agent-stats">
              <div class="agent-stat">
                <span class="agent-stat-label">Triggers</span>
                <span class="agent-stat-value">${agent.triggers_count || 0}</span>
              </div>
              <div class="agent-stat">
                <span class="agent-stat-label">Open Tasks</span>
                <span class="agent-stat-value">${agent.tasks_count || 0}</span>
              </div>
            </div>
            <div class="last-activity">Last active: ${timeAgo(agent.last_activity)}</div>
          </div>
        `).join('');
        
        document.getElementById('lastUpdate').textContent = ` • Updated ${new Date().toLocaleTimeString()}`;
        
      } catch (error) {
        console.error('Error loading agents:', error);
        document.getElementById('agentsGrid').innerHTML = `
          <div class="empty-state">
            <h2>Error loading agents</h2>
            <p>${error.message}</p>
          </div>
        `;
      }
    }
    
    // Initial load
    loadAgents();
    
    // Refresh every 30 seconds
    setInterval(loadAgents, 30000);
  </script>
</body>
</html>
